<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial News Simplifier</title>
  <meta name="description" content="Business headlines from India's markets, banking and economy, simplified and explained." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <h1>Financial News Simplifier</h1>
        <p class="tagline">Business headlines, read in plain language.</p>
      </div>

      <nav class="filters" id="filters" aria-label="Filter by section">
        <button class="filter-btn active" data-category="all">All stories</button>
        <button class="filter-btn" data-category="markets">Markets</button>
        <button class="filter-btn" data-category="banking">Banking</button>
        <button class="filter-btn" data-category="economy">Economy</button>
        <button class="filter-btn" data-category="corporate">Corporate</button>
        <button class="filter-btn" data-category="personal-finance">Personal finance</button>
        <button class="filter-btn" data-category="general">General</button>
      </nav>

      <div class="glossary">
        <h2>Terms explained <span id="glossary-count">0</span></h2>
        <div id="glossary-list"></div>
      </div>
    </aside>

    <main class="content">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search headlines" aria-label="Search headlines" />
        <div class="toolbar-actions">
          <span id="updated-at" class="updated"></span>
          <button id="refresh" class="icon-btn" type="button">Refresh</button>
          <button id="theme-toggle" class="icon-btn" type="button">Theme</button>
        </div>
      </div>

      <ul class="feed" id="feed" aria-live="polite"></ul>
    </main>
  </div>

  <script src="js/glossary.js"></script>
  <script src="js/simplify.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
